<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Results v4 · Save8</title>
<!-- Built from Figma "Result -4" (file 7BzQpRmM0cybXM4ZaNiVvO, node 116:1922), phone view 390 -->
<style>
@font-face{font-family:Inter;src:url(assets-v4/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --page:#F7F4ED; --surface:#fff; --ink:#0E0F0C; --body:#454745; --muted:#6A6C6A;
  --border:rgba(14,15,12,.12); --green:#007A45; --orange:#E6651A;
  --chip:#D9E8FA; --chip-ink:#0F2D6F; --btn2:#D8E0F2; --link:#000B80; --red:#BF1E2C;
}
*{box-sizing:border-box;margin:0}
body{background:#e9e5db;font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{width:390px;max-width:100%;margin:0 auto;background:var(--page);min-height:100vh;position:relative;padding-bottom:86px}
svg.i{display:block;flex:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}

/* Location header */
.hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(14,15,12,.1);background:var(--page)}
.menu{width:40px;height:40px;border-radius:999px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;flex:none}
.loc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.loc b{font-weight:500;font-size:13px;display:flex;gap:4px;align-items:center}
.loc span{font-size:14px;color:var(--muted)}

.content{padding:12px 8px 20px;display:flex;flex-direction:column;gap:12px}
.h-sm{padding:4px 8px 0;font-size:14px;color:var(--muted)}
.h-md{padding:4px 8px 0;font-size:15px;font-weight:500}
.card{background:#fff;border:1px solid rgba(14,15,12,.13);border-radius:20px}

/* Product and offers */
.po{padding:10px;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;gap:12px;align-items:flex-start}
.hero .img{width:88px;height:88px;border-radius:14px;border:1px solid rgba(14,15,12,.08);overflow:hidden;flex:none;background:#fff}
.hero .img img{width:100%;height:100%;object-fit:contain}
.hero .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.store-row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:14px;font-weight:500}
.store-row img{width:16px;height:16px;border-radius:50%;object-fit:cover}
.pill{background:rgba(0,122,69,.12);color:var(--green);font-size:10px;font-weight:500;padding:2px 7px;border-radius:6px;white-space:nowrap}
.pill.lg{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ptitle{font-weight:600;font-size:14px}
.hero .ptitle{font-size:15px;line-height:20px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--chip);color:var(--chip-ink);font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px}
/* Price row (Mobbin: Thrive Market) and best-combo strip (Mobbin: Swiggy) */
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 12px;border-radius:14px;background:rgba(14,15,12,.04)}
.prow small{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.prow b{font-size:15px;font-weight:700;color:var(--body)}
.cta-sm{background:var(--orange);color:#fff;font-weight:600;font-size:13px;padding:9px 14px;border-radius:999px;display:flex;gap:6px;align-items:center;white-space:nowrap;flex:none}
.best{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,122,69,.07)}
.best .lg{display:flex;flex:none}
.best .lg img{width:26px;height:26px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#fff}
.best .lg img+img{margin-left:-8px}
.best .t{flex:1;min-width:0;font-size:12px;color:var(--body);line-height:1.35}
.best .t b{display:block;color:var(--green);font-size:14px;font-weight:700}
.sec .n{color:var(--muted);font-weight:500}
.sec{display:flex;justify-content:space-between;align-items:center;padding:0 2px;font-weight:600;font-size:14px;color:var(--body)}
.sec .lnk{display:flex;align-items:center;gap:2px;font-weight:500;font-size:12px;color:var(--link)}
.rail{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:230px;scroll-snap-align:start;border:1px solid rgba(14,15,12,.11);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:14px;background:#fff}
.tile .top{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.tile .top img{width:30px;height:30px;border-radius:8px;border:1px solid rgba(14,15,12,.1);object-fit:contain;background:#fff;flex:none}
.tile .bot{display:flex;justify-content:space-between;align-items:center;color:var(--green);font-weight:600;font-size:13px;min-height:28px}
.buy{background:var(--btn2);color:var(--chip-ink);font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px}
.arrow{background:var(--btn2);color:var(--chip-ink);width:26px;height:26px;border-radius:999px;display:grid;place-items:center}
.arrow svg{transform:rotate(90deg)}
.hide{display:flex;justify-content:center;align-items:center;gap:4px;font-weight:600;font-size:13px;align-self:center;color:var(--ink)}
.hide svg{transition:transform .2s}
.offers{display:contents}
.po.collapsed .offers{display:none}
.po.collapsed .hide svg{transform:rotate(180deg)}

/* Best price list cards */
.lc{padding:12px;display:flex;flex-direction:column;gap:10px}
.lc .top{display:flex;gap:8px;align-items:center}
.lc .top>img{width:28px;height:28px;border-radius:14px;object-fit:cover;flex:none}
.lc .name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.lc .name b{font-size:15px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.right{display:flex;gap:8px;align-items:center;flex:none}
.hint{font-size:10px;color:var(--muted);text-align:right;line-height:1.2}
.allow{background:var(--btn2);color:var(--chip-ink);font-weight:700;font-size:11px;padding:6px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.save{display:flex;gap:6px;justify-content:center;align-items:center;color:var(--green);font-size:12px;font-weight:500;cursor:pointer}
.save b{font-weight:700}

/* Other stores carousel */
.car{display:flex;gap:10px;overflow-x:auto;padding-right:16px;align-items:stretch;scroll-snap-type:x proximity;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.oc{flex:none;width:313px;max-width:calc(100vw - 48px);scroll-snap-align:start;background:#fff;border:1px solid rgba(14,15,12,.13);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:14px}
.oc .info{display:flex;flex-direction:column;gap:6px}
.oc .st{display:flex;gap:8px;align-items:center;font-size:16px;font-weight:500;min-width:0}
.oc .st img{width:28px;height:28px;border-radius:50%;border:1px solid rgba(14,15,12,.1);object-fit:cover;flex:none}
.oc .st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc .nm{font-weight:600;font-size:14px;line-height:18px}
.cta{display:flex;gap:6px;align-items:center;justify-content:center;padding:10px;border-radius:999px;background:var(--orange);color:#fff;font-weight:600;font-size:16px;width:100%;min-height:42px;margin-top:auto}
.cta.loc2{background:var(--btn2);color:var(--chip-ink);font-size:14px}
.sv{display:flex;gap:4px;align-items:center;justify-content:center;color:var(--green);font-weight:600;font-size:12px;width:100%}
.oc.x-open .sv{color:var(--ink)}

/* Bottom dock */
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(390px,100%);display:flex;gap:10px;align-items:center;padding:12px 16px 24px;background:var(--page);border-top:1px solid rgba(14,15,12,.1);z-index:10}
.dock input{flex:1;min-width:0;border:1px solid rgba(0,11,128,.42);background:#FAFAF8;border-radius:999px;padding:13px 18px;font:15px Inter,sans-serif;color:var(--ink);outline:none;text-overflow:ellipsis}
.dock input::placeholder{color:var(--muted)}
.dock input:focus{border-color:var(--link)}
.dock button{flex:none;width:48px;height:48px;border-radius:999px;background:var(--orange);color:#fff;display:grid;place-items:center;opacity:.45;transition:opacity .15s}
.dock input:not(:placeholder-shown)+button{opacity:1}

/* Inline "Save ₹X more" expand (Mobbin: Careem pass accordion, Swiggy payment offers, foodpanda T&C) */
.tg svg{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.x-open .tg svg{transform:rotate(180deg)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1)}
.x-open .xp{grid-template-rows:1fr}
.xp>div{overflow:hidden;min-height:0}
.lc .xp{margin-top:-10px}
.oc .xp{margin-top:-14px}
.xb{display:flex;flex-direction:column;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(14,15,12,.08)}
.sum{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(0,122,69,.07);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--body)}
.sum b{color:var(--green);font-size:15px;white-space:nowrap}
.sum s{color:var(--muted);font-size:12px;margin-right:4px}
@media (prefers-reduced-motion:reduce){.xp,.tg svg{transition:none}}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const A = "assets-v4/";
const ICONS = {"card-offer-arrow": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"12.2287\" height=\"13.714\" viewBox=\"0 0 12.2287 13.714\" fill=\"none\"><path d=\"M12.2287 5.8853L6.51333 0.1713C6.46172 0.117166 6.39966 0.0740715 6.3309 0.0446268C6.26215 0.0151821 6.18813 0 6.11333 0C6.03854 0 5.96452 0.0151821 5.89577 0.0446268C5.82701 0.0740715 5.76495 0.117166 5.71333 0.1713L0 5.8853L0.8 6.6853L5.54267 1.94263V13.714H6.686V1.9433L11.4287 6.68597L12.2287 5.8853Z\" fill=\"currentColor\"/></svg>", "chevron-down-thin": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m19.5 8.25-7.5 7.5-7.5-7.5\"/></svg>", "chevron-down": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "chevron-right-thin": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"m8.25 4.5 7.5 7.5-7.5 7.5\"/></svg>", "chevron-right": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M9 6l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "chevron-up": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 15l6-6 6 6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>", "close": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18 18 6M6 6l12 12\"/></svg>", "external-link": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>", "location-pin": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z\"/><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z\"/></svg>", "menu": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5\"/></svg>", "more-horizontal": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z\"/></svg>", "send-arrow-up": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M11.47 2.47a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 1 1-1.06 1.06l-6.22-6.22V21a.75.75 0 0 1-1.5 0V4.81l-6.22 6.22a.75.75 0 1 1-1.06-1.06l7.5-7.5Z\" clip-rule=\"evenodd\"/></svg>", "share": "<svg xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\" stroke-width=\"1.5\" stroke=\"currentColor\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z\"/></svg>"};
const ic = (n, s) => ICONS[n].replace("<svg", `<svg class="i" width="${s}" height="${s}"`);
const logo = f => A + "logos/stores/" + f + ".png";
const phone = c => A + "products/apple-iphone-15-128gb-" + c + ".jpg";
const rs = n => "₹" + n.toLocaleString("en-IN");



// Snapshot from save8.ai, 12 Oct 2026 (iPhone 15 128GB Black). Figma "Result -4" lists the location-gated stores.
const bestPrices = [
  {n:"BigBasket", l:"bigbasket", save:2396, via:"gift cards & card rewards"},
  {n:"Zepto", l:"zepto", save:2276, via:"gift cards & card rewards"},
  {n:"Swiggy Instamart", l:"instamart", sale:"Quick India Movement · live", save:2995, via:"card rewards"},
];
const other = [
  {n:"Inspireonline", l:"inspireonline", t:"iPhone 15 128GB Black", p:64900, save:3245},
  {n:"Bigcmobiles", l:"bigcmobiles", t:"iPhone 15 128GB Black", sv:"Save up to 5% more"},
  {n:"Myg", l:"myg", t:"Apple iPhone 15 | 128GB | Black", sv:"Save up to 5% more"},
  {n:"iPlanet", l:"iplanet", t:"Apple iPhone 15 (128 GB) - Black", p:57504, oos:true, save:2875},
  {n:"Sathya Mobiles", l:"sathyamobiles", t:"Apple iPhone 15 (128 GB) - Pink", p:54900, save:2745},
  {n:"Flipkart", l:"flipkart", t:"Apple iPhone 15 (128 GB) - Blue", p:67999, save:1360},
  {n:"iVenus", l:"ivenus", t:"iPhone 15", p:66900, save:3345},
  {n:"Girias", l:"girias", t:"Apple iPhone 15 (128 GB) - Pink", p:89900, save:1798},
  {n:"Sathya", l:"sathya", t:"Apple iPhone 15 (128 GB) - Blue", sv:"Save 2% more"},
  {n:"JioMart", l:"jiomart", t:"Apple iPhone 15 (128 GB) - Black", loc:true, save:230},
];
const GIFT = [["amazon-shopping","Amazon shopping",1.75],["amazon-fresh","Amazon Fresh",2],["amazon-pay","Amazon Pay",1.25]];
const CARDS = [["icici-amazon-pay","Amazon Pay ICICI Card","5% / 3%",5],["sbi-card","Cashback SBI Card","5%",5],["standard-chartered","StanC Smart Credit Card","2%",2],["axis","Axis ACE Card","1.5%",1.5],[null,"YES Klick Card","1.5%",1.5]];

// First section: offers sorted by rate, card offers that have a logo
const GIFT_SORTED = [...GIFT].sort((a, b) => b[2] - a[2]);
const CARD_TILES = CARDS.filter(c => c[0]);
const tile = (img, name, rate, arrow) => `<div class="tile"><div class="top"><img src="${A}logos/${img}" alt=""><span>${name}</span></div>
  <div class="bot"><span>${rate} Off</span>${arrow ? `<button class="arrow" aria-label="${name} offer">${ic("card-offer-arrow",12)}</button>` : `<button class="buy">Buy</button>`}</div></div>`;

const listCard = s => `<div class="card lc"><div class="top"><img src="${logo(s.l)}" alt="">
    <div class="name"><b>${s.n}</b>${s.sale ? `<span class="pill lg">${s.sale}</span>` : ""}</div>
    <div class="right"><div class="hint">For price &amp;<br>availability</div><button class="allow">${ic("location-pin",14)}Allow location${ic("chevron-right",14)}</button></div></div>
    <button class="save tg" aria-expanded="false" data-x="best:${s.n}"><span>Save <b>${rs(s.save)}</b> more with ${s.via}.</span>${ic("chevron-down",17)}</button>
    <div class="xp"><div></div></div></div>`;

const otherCard = s => {
  const cta = s.loc ? `<button class="cta loc2">${ic("location-pin",14)}Allow location</button>`
    : `<button class="cta">${s.p ? rs(s.p) : "View price"} ${ic("external-link",13)}</button>`;
  return `<div class="oc">
    <div class="info">
      <div class="st"><img src="${logo(s.l)}" alt=""><span>${s.n}</span></div>
      <div class="nm">${s.t}</div>
    </div>
    ${cta}
    <div class="xp"><div></div></div>
    <button class="sv tg" aria-expanded="false" data-x="other:${s.n}"><span>${s.sv || `Save ${rs(s.save)} more`}</span> ${ic("chevron-down",12)}</button>
  </div>`;
};

document.getElementById("app").innerHTML = `
<header class="hdr">
  <button class="menu" aria-label="Menu">${ic("menu",20)}</button>
  <button class="loc"><b>Showing prices for ${ic("chevron-down-thin",14)}</b><span>Set your location</span></button>
  <button aria-label="More">${ic("more-horizontal",24)}</button>
</header>
<main class="content">
  <div class="h-sm">Found the best offers for Amazon</div>
  <section class="card po">
    <div class="hero">
      <div class="img"><img src="${phone("black")}" alt="iPhone 15 Black"></div>
      <div class="info">
        <div class="store-row"><img src="${logo("amazon")}" alt=""><span>Amazon</span><span class="pill">Great Indian Festival (GIF) · live</span></div>
        <div class="ptitle">Apple iPhone 15 (128 GB) - Black</div>
        <div class="chips"><span class="chip">128 GB</span><span class="chip">Black</span><span class="chip">iPhone 15</span></div>
      </div>
    </div>
    <div class="prow"><div><small>Amazon price</small><b>Not confirmed yet</b></div><button class="cta-sm">Check on Amazon ${ic("external-link",13)}</button></div>
    <div class="best"><span class="lg"><img src="${A}logos/gift-cards/amazon-fresh.png" alt=""><img src="${A}logos/banks/icici-amazon-pay.png" alt=""></span>
      <span class="t"><b>Save up to 6.9% with 2 offers</b>Amazon Fresh gift card 2% + Amazon Pay ICICI card 5%</span></div>
    <div class="offers">
      <div class="sec"><span>Gift card offers <span class="n">· ${GIFT_SORTED.length}</span></span>${ic("chevron-right",16)}</div>
      <div class="rail">${GIFT_SORTED.map(([f,n,r]) => tile(`gift-cards/${f}.png`, n, r + "%")).join("")}</div>
      <div class="sec"><span>Card offers <span class="n">· ${CARD_TILES.length}</span></span><button class="lnk">Add cards ${ic("chevron-right",14)}</button></div>
      <div class="rail">${CARD_TILES.map(([f,n,l]) => tile(`banks/${f}.png`, n, l, 1)).join("")}</div>
    </div>
    <button class="hide" aria-expanded="true"><span>Hide offers</span> ${ic("chevron-up",17)}</button>
  </section>
  <div class="h-md">Here are the best prices I found</div>
  ${bestPrices.map(listCard).join("")}
  <div class="h-md">Also found on other stores</div>
  <div class="car">${other.map(otherCard).join("")}</div>
</main>
<form class="dock" onsubmit="return false"><input placeholder="Paste a new product URL to compare" aria-label="Product URL"><button aria-label="Send">${ic("send-arrow-up",20)}</button></form>`;

const po = document.querySelector(".po"), hideBtn = po.querySelector(".hide");
hideBtn.addEventListener("click", () => {
  const c = po.classList.toggle("collapsed");
  hideBtn.firstElementChild.textContent = c ? `Show all ${GIFT_SORTED.length + CARD_TILES.length} offers` : "Hide offers";
  hideBtn.setAttribute("aria-expanded", String(!c));
});

// "Save ₹X more" expands the card in place, one card open at a time
const offersFor = st => {
  const price = st.p || null;
  const amt = r => price ? "-" + rs(Math.round(price * r / 100)) : "";
  const gifts = !st.via || st.via.includes("gift");
  const sum = price && st.save
    ? `<div class="sum"><span>You pay after offers</span><span><s>${rs(price)}</s><b>${rs(price - st.save)}</b></span></div>`
    : `<div class="sum"><span>${st.save ? "Extra savings with offers" : "Price shown on the store site"}</span><b>${st.save ? "up to " + rs(st.save) : (st.sv || "").replace(/^Save /, "").replace(/ more$/, "")}</b></div>`;
  const last = other.includes(st); // carousel cards: summary sits at the bottom, just above "Hide offers"
  // Same layout as the "Product and offers" card: section header + sideways rail of offer tiles
  return `<div class="xb">${last ? "" : sum}
    ${gifts ? `<div class="sec"><span>Gift Card Offers</span>${ic("chevron-right",16)}</div>
    <div class="rail">${GIFT.map(([f,n,r]) => tile(`gift-cards/${f}.png`, n, r + "%")).join("")}</div>` : ""}
    <div class="sec"><span>Payment Offers</span><button class="lnk">Add Cards ${ic("chevron-right",14)}</button></div>
    <div class="rail">${CARDS.filter(c => c[0]).map(([f,n,l]) => tile(`banks/${f}.png`, n, l, 1)).join("")}</div>
    ${last ? sum : ""}
  </div>`;
};
const setOpen = (card, open) => {
  const t = card.querySelector(".tg");
  card.classList.toggle("x-open", open);
  t.setAttribute("aria-expanded", String(open));
  const label = t.querySelector("span");
  if (card.classList.contains("oc")) { label.dataset.l ||= label.textContent; label.textContent = open ? "Hide offers" : label.dataset.l; }
};
// List cards: one open at a time. Carousel cards: open and close together, so the row stays even.
const fill = card => {
  const panel = card.querySelector(".xp>div");
  if (panel.firstChild) return;
  const x = card.querySelector(".tg").dataset.x, i = x.indexOf(":"), kind = x.slice(0, i), name = x.slice(i + 1);
  panel.innerHTML = offersFor((kind === "best" ? bestPrices : other).find(o => o.n === name));
};
document.addEventListener("click", e => {
  const t = e.target.closest(".tg");
  if (!t) return;
  const card = t.closest(".lc, .oc");
  const group = card.classList.contains("oc") ? [...card.parentElement.querySelectorAll(".oc")] : [card];
  const open = !card.classList.contains("x-open");
  document.querySelectorAll(".x-open").forEach(c => !group.includes(c) && setOpen(c, false));
  group.forEach(c => { if (open) fill(c); setOpen(c, open); });
});
</script>
</body>
</html>
